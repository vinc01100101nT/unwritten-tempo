<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Unwritten Wiki</title>
<!--
  CONTENT-FREE VIEWER.
  This file holds ZERO wiki text — only structure, styling, and a markdown renderer.
  All page content lives in ./content/*.md, exported verbatim from the Tempo docs
  (see content/manifest.json for each page's source docId). To update the wiki,
  edit the source doc in Tempo and re-export the .md file; this shell never changes.
-->
<style>
  :root{
    --charcoal:#14130f;--charcoal-2:#1c1a15;--panel:#211e18;--panel-2:#26221b;
    --ink:#e9e2d0;--ink-dim:#b3a98f;--ink-faint:#8a806a;
    --gold:#c8a24a;--gold-bright:#e6c168;--rule:#3a352a;--accent:#7fae86;--danger:#c98b6a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:radial-gradient(1200px 600px at 70% -10%, rgba(200,162,74,0.08), transparent 60%),var(--charcoal);
    color:var(--ink);font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    line-height:1.65;-webkit-font-smoothing:antialiased;
  }
  a{color:var(--gold-bright);text-decoration:none}
  a:hover{text-decoration:underline}
  .wrap{display:flex;min-height:100vh}
  .sidebar{width:300px;flex:0 0 300px;background:linear-gradient(180deg,var(--charcoal-2),#100f0c);
    border-right:1px solid var(--rule);padding:0 0 40px;position:sticky;top:0;height:100vh;overflow-y:auto}
  .brand{padding:26px 24px 18px;border-bottom:1px solid var(--rule);text-align:center}
  .brand .ring{width:64px;height:64px;margin:0 auto 12px;border-radius:50%;border:3px solid var(--gold);
    box-shadow:0 0 0 4px rgba(200,162,74,0.12),inset 0 0 22px rgba(200,162,74,0.25);
    display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--gold-bright)}
  .brand h1{font-size:22px;margin:0;letter-spacing:3px;text-transform:uppercase;font-weight:600;color:var(--ink)}
  .brand .sub{font-size:11px;color:var(--ink-faint);letter-spacing:1px;margin-top:4px;font-style:italic}
  nav{padding:16px 12px 0}
  .navgroup{margin-bottom:18px}
  .navgroup h3{font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:var(--gold);
    margin:0 0 6px;padding:0 12px;font-weight:700}
  nav a{display:block;color:var(--ink-dim);padding:7px 14px;border-radius:6px;font-size:15px;
    border-left:2px solid transparent;cursor:pointer}
  nav a:hover{background:var(--panel);color:var(--ink);text-decoration:none}
  nav a.active{background:linear-gradient(90deg,rgba(200,162,74,0.16),transparent);
    color:var(--gold-bright);border-left:2px solid var(--gold)}
  nav a .tag{font-size:9px;color:var(--ink-faint);font-style:italic;margin-left:4px}
  main{flex:1;max-width:900px;margin:0 auto;padding:52px 60px 120px}
  #content{animation:fade .35s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  #content h1{font-size:44px;margin:0 0 16px;font-weight:600;line-height:1.12}
  #content h2{font-size:26px;margin:38px 0 12px;color:var(--gold-bright);font-weight:600;
    border-bottom:1px solid var(--rule);padding-bottom:6px}
  #content h3{font-size:19px;margin:26px 0 8px;color:var(--ink)}
  #content p{margin:12px 0}
  #content p.lede{font-style:italic;color:var(--ink-dim);font-size:18px;margin:0 0 26px;
    border-bottom:1px solid var(--rule);padding-bottom:22px}
  #content ul,#content ol{margin:12px 0;padding-left:22px}
  #content li{margin:6px 0}
  #content strong{color:#f4eedd}
  #content em{color:var(--ink-dim)}
  #content code{background:var(--panel-2);border:1px solid var(--rule);border-radius:4px;
    padding:1px 5px;font-family:ui-monospace,Menlo,monospace;font-size:13px;color:var(--gold-bright)}
  #content table{width:100%;border-collapse:collapse;margin:18px 0;font-size:15px}
  #content th,#content td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--rule);vertical-align:top}
  #content th{color:var(--gold);font-size:12px;letter-spacing:1px;text-transform:uppercase;background:rgba(200,162,74,0.05)}
  #content tr:hover td{background:rgba(255,255,255,0.02)}
  #content blockquote{background:var(--panel);border:1px solid var(--rule);border-left:3px solid var(--gold);
    padding:12px 16px;border-radius:6px;margin:20px 0;font-size:14px;color:var(--ink-dim);font-style:italic}
  #content blockquote p{margin:4px 0}
  #content hr{border:none;border-top:1px solid var(--rule);margin:34px 0}
  .loading{color:var(--ink-faint);font-style:italic;padding:40px 0}
  footer{margin-top:60px;padding-top:20px;border-top:1px solid var(--rule);color:var(--ink-faint);font-size:12px;font-style:italic}
  @media(max-width:820px){
    .wrap{flex-direction:column}
    .sidebar{width:100%;height:auto;position:static;flex:none}
    main{padding:32px 22px 80px}
  }
</style>
</head>
<body>
<div class="wrap">
  <aside class="sidebar">
    <div class="brand">
      <div class="ring">◍</div>
      <h1>Unwritten</h1>
      <div class="sub">the world's un-written record</div>
    </div>
    <nav id="nav"></nav>
  </aside>
  <main>
    <div id="content"><div class="loading">Loading…</div></div>
    <footer>Unwritten Wiki — content served from <code>./content/*.md</code>, exported from the Tempo docs. This page holds no text of its own.</footer>
  </main>
</div>

<script>
// ---- tiny markdown renderer (headings, bold/italic/code/links, lists, tables, quotes, hr) ----
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function inline(s){
  return esc(s)
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/\*([^*]+)\*/g,'<em>$1</em>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2">$1</a>');
}
function md(src){
  const lines=src.replace(/\r/g,'').split('\n');
  let html='',i=0,firstPara=true;
  const isTableRow=l=>/^\s*\|.*\|\s*$/.test(l);
  while(i<lines.length){
    let l=lines[i];
    if(!l.trim()){i++;continue;}
    // heading
    let h=l.match(/^(#{1,6})\s+(.*)$/);
    if(h){const n=h[1].length;html+=`<h${n}>${inline(h[2])}</h${n}>`;i++;firstPara=false;continue;}
    // hr
    if(/^(\*\*\*|---|___)\s*$/.test(l)){html+='<hr>';i++;continue;}
    // blockquote (consecutive >)
    if(/^>\s?/.test(l)){let b=[];while(i<lines.length&&/^>\s?/.test(lines[i])){b.push(lines[i].replace(/^>\s?/,''));i++;}
      html+='<blockquote>'+b.filter(x=>x.trim()).map(x=>`<p>${inline(x)}</p>`).join('')+'</blockquote>';continue;}
    // table
    if(isTableRow(l)&&i+1<lines.length&&/^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i+1])){
      const cells=r=>r.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
      const head=cells(l);i+=2;let rows=[];
      while(i<lines.length&&isTableRow(lines[i])){rows.push(cells(lines[i]));i++;}
      html+='<table><thead><tr>'+head.map(c=>`<th>${inline(c)}</th>`).join('')+'</tr></thead><tbody>'+
        rows.map(r=>'<tr>'+r.map(c=>`<td>${inline(c)}</td>`).join('')+'</tr>').join('')+'</tbody></table>';
      continue;
    }
    // unordered list
    if(/^\s*[-*]\s+/.test(l)){let items=[];while(i<lines.length&&/^\s*[-*]\s+/.test(lines[i])){items.push(lines[i].replace(/^\s*[-*]\s+/,''));i++;}
      html+='<ul>'+items.map(x=>`<li>${inline(x)}</li>`).join('')+'</ul>';continue;}
    // ordered list
    if(/^\s*\d+\.\s+/.test(l)){let items=[];while(i<lines.length&&/^\s*\d+\.\s+/.test(lines[i])){items.push(lines[i].replace(/^\s*\d+\.\s+/,''));i++;}
      html+='<ol>'+items.map(x=>`<li>${inline(x)}</li>`).join('')+'</ol>';continue;}
    // paragraph (gather until blank)
    let para=[l];i++;
    while(i<lines.length&&lines[i].trim()&&!/^(#{1,6}\s|>|\s*[-*]\s|\s*\d+\.\s)/.test(lines[i])&&!isTableRow(lines[i])){para.push(lines[i]);i++;}
    let text=para.join(' ').trim();
    // first fully-italic paragraph = lede subtitle
    if(firstPara && /^\*[^*].*[^*]\*$/.test(text) && !text.startsWith('**')){
      html+=`<p class="lede">${inline(text.slice(1,-1))}</p>`;
    } else {
      html+=`<p>${inline(text)}</p>`;
    }
    firstPara=false;
  }
  return html;
}

// ---- app: build nav from manifest, load pages from .md files ----
let PAGES={};
async function load(id){
  const p=PAGES[id]; if(!p) return;
  const el=document.getElementById('content');
  el.innerHTML='<div class="loading">Loading…</div>';
  try{
    const res=await fetch('content/'+p.file,{cache:'no-store'});
    if(!res.ok) throw new Error(res.status);
    const text=await res.text();
    el.innerHTML=md(text);
  }catch(e){
    el.innerHTML=`<h1>Couldn't load page</h1><p class="lede">${p.file} — ${e.message}</p>`;
  }
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('active',a.dataset.p===id));
  if(location.hash!=='#'+id) history.replaceState(null,'','#'+id);
  window.scrollTo(0,0);
}
async function boot(){
  const man=await (await fetch('content/manifest.json',{cache:'no-store'})).json();
  const nav=document.getElementById('nav');
  let first=null;
  man.groups.forEach(g=>{
    const box=document.createElement('div');box.className='navgroup';
    box.innerHTML=`<h3>${g.title}</h3>`;
    g.pages.forEach(pg=>{
      PAGES[pg.id]=pg; if(!first)first=pg.id;
      const a=document.createElement('a');a.dataset.p=pg.id;
      a.innerHTML=pg.title+(pg.tag?` <span class="tag">${pg.tag}</span>`:'');
      a.addEventListener('click',e=>{e.preventDefault();load(pg.id);});
      box.appendChild(a);
    });
    nav.appendChild(box);
  });
  load((location.hash||'#'+first).slice(1));
}
boot();
</script>
</body>
</html>
