<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Unwritten Wiki</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="assets/unwritten-logo.png">
<!--
  CONTENT-FREE VIEWER.
  This file holds ZERO wiki text — only structure, styling, and the renderers.
  Page content lives in ./content/ as JSON block documents ({ title, blocks:[] }) —
  the one content format (see content/manifest.json for the page list). Block types:
  lede, heading, paragraph, list, table, quote/callout, image, skillTable, skillDatabase, mobTable, worldMap,
  elementTable, equipmentTable, materialTable, trademarkTable, armorVariantTable, serverStats, timeline, hr.
  mobTable draws every creature from content/monsters.generated.json, which the game writes from its own data.
  skillDatabase draws every skill as one table from content/skills.generated.json — numbers, description and effects.
  equipmentTable and materialTable draw the items from content/items.generated.json (who drops a material included);
  trademarkTable and armorVariantTable draw, from the same file, every trademark a forge can roll and every armour
  word, with what each does at every grade.
  elementTable draws the game's element chart, every level, from content/elements.generated.json.
  worldMap draws the game's world map from content/world.generated.json; hovering a map shows its preview and the
  creatures that live there, joined from the creature export.
  serverStats draws an empty box that is filled from a live server and refreshed while the page is open.
-->
<style>
  :root{
    --charcoal:#14130f;--charcoal-2:#1c1a15;--panel:#211e18;--panel-2:#26221b;
    --ink:#e9e2d0;--ink-dim:#b3a98f;--ink-faint:#8a806a;
    --gold:#c8a24a;--gold-bright:#e6c168;--rule:#3a352a;--accent:#7fae86;--danger:#c98b6a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:radial-gradient(1200px 600px at 70% -10%, rgba(200,162,74,0.08), transparent 60%),var(--charcoal);
    color:var(--ink);font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    line-height:1.65;-webkit-font-smoothing:antialiased;
  }
  a{color:var(--gold-bright);text-decoration:none}
  a:hover{text-decoration:underline}
  .wrap{display:flex;min-height:100vh}
  .sidebar{width:300px;flex:0 0 300px;background:linear-gradient(180deg,var(--charcoal-2),#100f0c);
    border-right:1px solid var(--rule);padding:0 0 40px;position:sticky;top:0;height:100vh;overflow-y:auto}
  .brand{padding:18px 20px 16px;border-bottom:1px solid var(--rule);text-align:center}
  /* Logo art is on a black field with no alpha; screen blending drops that field into the sidebar. */
  .brand .logo{display:block;width:236px;max-width:100%;margin:0 auto;mix-blend-mode:screen}
  .sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;
    clip:rect(0 0 0 0);white-space:nowrap;border:0}
  nav{padding:16px 12px 0}
  .navgroup{margin-bottom:18px}
  .navgroup h3{font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:var(--gold);
    margin:0 0 6px;padding:0 12px;font-weight:700}
  nav a{display:block;color:var(--ink-dim);padding:7px 14px;border-radius:6px;font-size:15px;
    border-left:2px solid transparent;cursor:pointer}
  nav a:hover{background:var(--panel);color:var(--ink);text-decoration:none}
  nav a.active{background:linear-gradient(90deg,rgba(200,162,74,0.16),transparent);
    color:var(--gold-bright);border-left:2px solid var(--gold)}
  nav a .tag{font-size:9px;color:var(--ink-faint);font-style:italic;margin-left:4px}
  main{flex:1;max-width:900px;margin:0 auto;padding:52px 60px 120px}
  #content{animation:fade .35s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  #content h1{font-size:44px;margin:0 0 16px;font-weight:600;line-height:1.12}
  #content h2{font-size:26px;margin:38px 0 12px;color:var(--gold-bright);font-weight:600;
    border-bottom:1px solid var(--rule);padding-bottom:6px}
  #content h3{font-size:19px;margin:26px 0 8px;color:var(--ink)}
  #content p{margin:12px 0}
  #content p.lede{font-style:italic;color:var(--ink-dim);font-size:18px;margin:0 0 26px;
    border-bottom:1px solid var(--rule);padding-bottom:22px}
  #content ul,#content ol{margin:12px 0;padding-left:22px}
  #content li{margin:6px 0}
  #content strong{color:#f4eedd}
  #content em{color:var(--ink-dim)}
  #content code{background:var(--panel-2);border:1px solid var(--rule);border-radius:4px;
    padding:1px 5px;font-family:ui-monospace,Menlo,monospace;font-size:13px;color:var(--gold-bright)}
  #content table{width:100%;border-collapse:collapse;margin:18px 0;font-size:15px}
  #content th,#content td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--rule);vertical-align:top}
  #content th{color:var(--gold);font-size:12px;letter-spacing:1px;text-transform:uppercase;background:rgba(200,162,74,0.05)}
  #content tr:hover td{background:rgba(255,255,255,0.02)}
  /* The creature table is wider and far taller than the page, so it scrolls inside its own box — which keeps the
     sideways scrollbar on screen — with the column names pinned to the top of that box. */
  #content .dbscroll{overflow:auto;max-height:80vh;margin:18px 0;border:1px solid var(--rule);border-radius:6px}
  #content .dbscroll thead th{position:sticky;top:0;z-index:1;background:var(--charcoal-2)}
  #content .dbscroll table{margin:0;font-size:13px;width:max-content}
  #content .dbscroll th,#content .dbscroll td{padding:7px 9px;white-space:nowrap}
  /* A table cell ignores min-width, so the two long columns get a fixed width to wrap inside. */
  #content .dbscroll td.long{white-space:normal;width:22em}
  #content .dbscroll ul{margin:0;padding-left:1.1em}
  #content .dbscroll li{margin:0}
  #content .dbscroll .sym{display:inline-block;min-width:2.4em;margin-right:6px;padding:0 4px;border:1px solid;border-radius:4px;
    text-align:center;font-weight:700}
  /* element chart (JSON elementTable block): a 10×10 grid per level, scrolling sideways on a narrow screen */
  #content .xscroll{overflow-x:auto;margin:12px 0 26px}
  #content .xscroll table{margin:0;font-size:13px;width:auto}
  #content .xscroll th,#content .xscroll td{padding:6px 7px;white-space:nowrap;text-align:right}
  #content .xscroll th{letter-spacing:.3px}
  #content .xscroll th:first-child,#content .xscroll td:first-child{text-align:left}
  /* world map (JSON worldMap block): the picture with every map outlined where the game places it */
  #content .worldmap{position:relative;margin:18px 0;border:1px solid var(--rule);border-radius:6px;overflow:hidden;line-height:0}
  #content .worldmap img{display:block;width:100%;height:auto}
  #content .worldmap .zone{position:absolute;border:1px solid rgba(233,226,208,0.45);border-radius:2px;cursor:pointer}
  #content .worldmap .zone:hover,#content .worldmap .zone.on{border-color:var(--gold-bright);background:rgba(230,193,104,0.18)}
  .zonecard{position:fixed;z-index:20;width:280px;background:var(--panel);border:1px solid var(--gold);border-radius:8px;
    padding:10px 12px;font-size:13px;line-height:1.45;color:var(--ink);box-shadow:0 8px 28px rgba(0,0,0,0.55);pointer-events:none}
  .zonecard[hidden]{display:none}
  .zonecard .zname{font-size:16px;font-weight:600;color:#f4eedd}
  .zonecard .ztype{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--gold)}
  .zonecard img{display:block;width:100%;margin:8px 0;border:1px solid var(--rule);border-radius:4px}
  .zonecard ul{margin:4px 0 0;padding-left:16px}
  .zonecard li{margin:1px 0}
  #content blockquote{background:var(--panel);border:1px solid var(--rule);border-left:3px solid var(--gold);
    padding:12px 16px;border-radius:6px;margin:20px 0;font-size:14px;color:var(--ink-dim);font-style:italic}
  #content blockquote p{margin:4px 0}
  #content hr{border:none;border-top:1px solid var(--rule);margin:34px 0}
  /* skill cards (JSON skillTable block) */
  #content .skill-sub{font-style:italic;color:var(--ink-dim);font-size:15px;margin:0 0 14px}
  .skillgrid{display:grid;gap:12px;margin:16px 0 26px}
  .skillcard{display:grid;grid-template-columns:60px 1fr;gap:14px;align-items:start;
    background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:13px 16px}
  .skillcard .icon{width:60px;height:60px;border-radius:8px;background:var(--panel-2);
    border:1px solid var(--rule);display:flex;align-items:center;justify-content:center;
    color:var(--gold);font-size:24px;font-weight:600;overflow:hidden}
  .skillcard .icon img{width:100%;height:100%;object-fit:cover;display:block}
  /* A two-letter symbol reads as a chemical element: slightly smaller than a single letter so both fit the same box,
     and it wears the weapon's colour (set inline, since the colour is data). */
  .skillcard .icon.sym{font-size:22px;letter-spacing:.5px;font-weight:700}
  .skillcard .body{min-width:0}
  .skillcard .head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .skillcard .name{font-size:17px;font-weight:600;color:#f4eedd}
  .skillcard .cost{font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--gold)}
  .skillcard .flavor{font-style:italic;color:var(--ink-dim);font-size:14px;margin:3px 0 6px}
  .skillcard .effect{font-size:14.5px;color:var(--ink);line-height:1.55}
  /* A generated card lists one line per effect. Bullets are drawn by the list, never typed into the text. */
  .skillcard ul.effect{margin:0;padding-left:1.1em;list-style:disc}
  .skillcard ul.effect li{margin:1px 0}
  .skillcard .effect strong{color:var(--gold-bright)}
  #content figure.fig{margin:20px 0;text-align:center}
  #content figure.fig img{max-width:100%;border:1px solid var(--rule);border-radius:8px}
  #content figure.fig figcaption{font-size:13px;color:var(--ink-faint);font-style:italic;margin-top:8px}
  /* live server numbers (JSON serverStats block) */
  .livestats .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:18px 0 6px}
  .livestats .tile{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:14px 16px}
  .livestats .tile .n{font-size:30px;color:var(--gold-bright);line-height:1.2}
  .livestats .tile .k{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-faint)}
  .livestats .asof{font-size:12px;color:var(--ink-faint);font-style:italic;margin:2px 0 0}
  .livestats .down{background:var(--panel);border:1px solid var(--rule);border-left:3px solid var(--danger);
    padding:12px 16px;border-radius:6px;color:var(--ink-dim);font-size:14px}
  .livestats td.num{text-align:right;font-variant-numeric:tabular-nums}
  /* one vertical line of dated dots (JSON timeline block): a date column, the rail with its dot, then the entry */
  #content ol.timeline{list-style:none;margin:10px 0 30px;padding:0}
  #content li.tl-item{display:grid;grid-template-columns:118px 26px 1fr;gap:0 12px;margin:0}
  .tl-when{text-align:right;font-size:12px;letter-spacing:.5px;text-transform:uppercase;color:var(--ink-faint);padding-top:2px}
  .tl-rail{position:relative}
  .tl-rail::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--rule)}
  .tl-item:first-child .tl-rail::before{top:12px}
  .tl-item:last-child .tl-rail::before{bottom:auto;height:12px}
  .tl-rail::after{content:"";position:absolute;left:50%;top:6px;width:12px;height:12px;margin-left:-6px;border-radius:50%}
  .tl-done .tl-rail::after{background:var(--gold);border:2px solid var(--gold)}
  .tl-planned .tl-rail::after{background:var(--charcoal);border:2px solid var(--ink-faint)}
  .tl-now .tl-rail::after{width:16px;height:16px;margin-left:-8px;top:4px;background:var(--accent);box-shadow:0 0 0 4px rgba(127,174,134,.25)}
  .tl-now .tl-when{color:var(--accent);font-weight:700}
  .tl-body{padding:0 0 22px;min-width:0}
  .tl-title{font-size:16px;font-weight:600;color:#f4eedd}
  .tl-planned .tl-title{color:var(--ink-dim)}
  .tl-text{font-size:14.5px;color:var(--ink-dim)}
  .loading{color:var(--ink-faint);font-style:italic;padding:40px 0}
  footer{margin-top:60px;padding-top:20px;border-top:1px solid var(--rule);color:var(--ink-faint);font-size:12px;font-style:italic}
  @media(max-width:820px){
    .wrap{flex-direction:column}
    .sidebar{width:100%;height:auto;position:static;flex:none}
    main{padding:32px 22px 80px}
    #content li.tl-item{grid-template-columns:84px 22px 1fr;gap:0 8px}
  }
</style>
</head>
<body>
<div class="wrap">
  <aside class="sidebar">
    <div class="brand">
      <img class="logo" src="assets/unwritten-logo.png"
           alt="Unwritten — your story, your destiny, unwritten">
      <h1 class="sr-only">Unwritten</h1>
    </div>
    <nav id="nav"></nav>
  </aside>
  <main>
    <div id="content"><div class="loading">Loading…</div></div>
    <footer>Unwritten Wiki — content served from <code>./content/</code> as JSON block documents. This page holds no text of its own.</footer>
  </main>
</div>

<script>
// ---- inline markdown (bold/italic/code/links) used inside block text fields ----
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function inline(s){
  return esc(s)
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/\*([^*]+)\*/g,'<em>$1</em>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2">$1</a>');
}

// ---- JSON block-document renderer (the canonical and only content format) ----
function skillIcon(s){
  if(s.icon) return `<span class="icon"><img src="${esc(s.icon)}" alt="${esc(s.name||'')}"></span>`;
  // A skill's two-letter symbol, worn in its weapon's colour — the same pair the game puts on a tile. Falls back to
  // the first letter only when nobody has authored a symbol, so an unauthored one stays visibly different.
  const sym=(s.symbol||'').trim();
  const tint=s.color?` style="color:${esc(s.color)};border-color:${esc(s.color)}"`:'';
  return `<span class="icon${sym?' sym':''}"${tint}>${esc(sym||(s.name||'?').trim().slice(0,1))}</span>`;
}
// Generated skill data — content/skills.generated.json, written by the editor from the game's own skill assets.
// A skillTable block that names a `source`, and the skillDatabase block, are rendered FROM this, so a number on the
// page cannot disagree with the number in the game. Read afresh on every visit to a page that needs it.
let SKILLS=null;
async function ensureSkills(){
  if(SKILLS) return SKILLS;
  try{
    const res=await fetch('content/skills.generated.json',{cache:'no-store'});
    SKILLS=res.ok?await res.json():{skills:[]};
  }catch(e){ SKILLS={skills:[]}; }
  return SKILLS;
}
// Generated creature data — content/monsters.generated.json, written by the game's editor from the creature catalog
// and the world spawn list. A mobTable block is rendered FROM this, so no creature number is ever typed on a page.
let MOBS=null;
async function ensureMobs(){
  if(MOBS) return MOBS;
  try{
    const res=await fetch('content/monsters.generated.json',{cache:'no-store'});
    MOBS=res.ok?await res.json():{creatures:[]};
  }catch(e){ MOBS={creatures:[]}; }
  return MOBS;
}
function needsMobs(doc){
  return (doc.blocks||[]).some(b=>b&&b.type==='mobTable');
}
function mobTable(){
  const all=(MOBS&&MOBS.creatures)||[];
  if(!all.length) return '<p><em>No creatures exported yet — run the Mob Table\'s Save All in the editor.</em></p>';
  const where=m=>(m.homes||[]).length?m.homes.map(h=>`${esc(h.name)} ×${h.count}`).join(', '):'—';
  return '<div class="dbscroll"><table><thead><tr>'+
    ['Name','Lv','Locations','Kind','Element','Size','Biome','HP','ATK','DEF','FLEE','XP','Gold','Drops']
      .map(h=>`<th>${h}</th>`).join('')+
    '</tr></thead><tbody>'+
    all.map(m=>'<tr>'+
      `<td><strong>${esc(m.name||m.id)}</strong></td><td>${m.level}</td><td class="long">${where(m)}</td><td>${esc(m.kind)}</td>`+
      `<td>${esc(m.element)} ${m.elementLevel}</td><td>${esc(m.size)}</td><td>${esc(m.biome)}</td>`+
      `<td>${m.hp}</td><td>${m.atk}</td><td>${m.def}</td><td>${m.flee}</td><td>${m.xp}</td>`+
      `<td>${m.goldMin}–${m.goldMax}</td><td class="long">${esc(m.drops||'')}</td>`+
    '</tr>').join('')+
    '</tbody></table></div>';
}
// Generated world map — content/world.generated.json, written by the game's editor from the same world map the
// game's World Map window loads. Which creatures live on each map is joined here from the creature export, so there
// is one copy of it, and it moves the moment a creature is placed somewhere else.
let WORLD=null;
async function ensureWorld(){
  if(WORLD) return WORLD;
  try{
    const res=await fetch('content/world.generated.json',{cache:'no-store'});
    WORLD=res.ok?await res.json():{maps:[]};
  }catch(e){ WORLD={maps:[]}; }
  return WORLD;
}
function needsWorld(doc){
  return (doc.blocks||[]).some(b=>b&&b.type==='worldMap');
}
function worldMap(){
  const maps=(WORLD&&WORLD.maps)||[];
  if(!maps.length) return '<p><em>No world map exported yet — bake the world map in the editor.</em></p>';
  const pct=v=>(v*100).toFixed(3)+'%';
  return `<div class="worldmap"><img src="${esc(WORLD.picture)}" alt="World map">`+
    maps.map(z=>`<a class="zone" data-zone="${esc(z.id)}" style="left:${pct(z.left)};top:${pct(z.top)};`+
                `width:${pct(z.width)};height:${pct(z.height)}" aria-label="${esc(z.name)}"></a>`).join('')+
    '</div><div class="zonecard" hidden></div>';
}
// Every creature placed on each map, strongest last, read off the creature export's homes.
function livesOn(){
  const by={};
  ((MOBS&&MOBS.creatures)||[]).forEach(m=>(m.homes||[]).forEach(h=>{
    (by[h.map]=by[h.map]||[]).push({name:m.name||m.id,level:m.level,count:h.count});
  }));
  Object.values(by).forEach(l=>l.sort((a,b)=>a.level-b.level||a.name.localeCompare(b.name)));
  return by;
}
function wireWorldMap(){
  const box=document.querySelector('#content .worldmap'); if(!box) return;
  const card=document.querySelector('#content .zonecard');
  const byId={}; ((WORLD&&WORLD.maps)||[]).forEach(z=>byId[z.id]=z);
  const lives=livesOn();
  const fill=z=>{
    const who=lives[z.id]||[];
    card.innerHTML=`<div class="zname">${esc(z.name)}</div><div class="ztype">${esc(z.type||'')}</div>`+
      (z.preview?`<img src="${esc(z.preview)}" alt="${esc(z.name)} from above">`:'')+
      '<strong>Monsters</strong>'+(who.length
        ?'<ul>'+who.map(c=>`<li>${esc(c.name)} — Lv ${c.level} ×${c.count}</li>`).join('')+'</ul>'
        :'<div>—</div>');
  };
  const place=(x,y)=>{
    const r=card.getBoundingClientRect(), pad=14;
    let left=x+pad, top=y+pad;
    if(left+r.width>innerWidth-8) left=x-r.width-pad;
    if(top+r.height>innerHeight-8) top=Math.max(8,innerHeight-r.height-8);
    card.style.left=Math.max(8,left)+'px'; card.style.top=top+'px';
  };
  let shown=null;
  const show=(el,x,y)=>{
    if(shown!==el){ if(shown) shown.classList.remove('on'); shown=el; el.classList.add('on'); fill(byId[el.dataset.zone]); card.hidden=false; }
    place(x,y);
  };
  const hide=()=>{ if(shown) shown.classList.remove('on'); shown=null; card.hidden=true; };
  box.querySelectorAll('.zone').forEach(el=>{
    el.addEventListener('mousemove',e=>show(el,e.clientX,e.clientY));
    el.addEventListener('mouseleave',hide);
    // A touch screen has no hover: a tap shows the card, a second tap on the same map hides it.
    el.addEventListener('click',e=>{ e.preventDefault(); if(shown===el) hide(); else show(el,e.clientX,e.clientY); });
  });
}
// Generated element chart — content/elements.generated.json, written by the game's editor from the chart the game
// hits with. Rows are the attack's element, columns the defender's; one table per defending element level.
let ELEMENTS=null;
async function ensureElements(){
  if(ELEMENTS) return ELEMENTS;
  try{
    const res=await fetch('content/elements.generated.json',{cache:'no-store'});
    ELEMENTS=res.ok?await res.json():{levels:[]};
  }catch(e){ ELEMENTS={levels:[]}; }
  return ELEMENTS;
}
function needsElements(doc){
  return (doc.blocks||[]).some(b=>b&&b.type==='elementTable');
}
function elementTable(){
  const levels=(ELEMENTS&&ELEMENTS.levels)||[], names=(ELEMENTS&&ELEMENTS.elements)||[];
  if(!levels.length) return '<p><em>No element chart exported yet — open the editor once to write it.</em></p>';
  return levels.map(l=>`<h2>Level ${l.level}</h2><div class="xscroll"><table><thead><tr><th>Attack ↓</th>`+
    names.map(n=>`<th>${esc(n)}</th>`).join('')+'</tr></thead><tbody>'+
    l.rows.map(r=>`<tr><td><strong>${esc(r.attack)}</strong></td>`+r.percent.map(p=>`<td>${p}%</td>`).join('')+'</tr>').join('')+
    '</tbody></table></div>').join('');
}
// Generated item data — content/items.generated.json, written by the game's editor from every item asset, with who
// drops each one read from the same tables a creature's death roll reads.
let ITEMS=null;
async function ensureItems(){
  if(ITEMS) return ITEMS;
  try{
    const res=await fetch('content/items.generated.json',{cache:'no-store'});
    ITEMS=res.ok?await res.json():{items:[]};
  }catch(e){ ITEMS={items:[]}; }
  return ITEMS;
}
function needsItems(doc){
  return (doc.blocks||[]).some(b=>b&&['equipmentTable','materialTable','trademarkTable','armorVariantTable'].includes(b.type));
}
const dash=v=>(v===undefined||v===null||v===''||v===0)?'—':v;
const descCell=d=>d?String(d).split('\n').filter(x=>x.trim()).map(x=>`<div>${inline(x)}</div>`).join(''):'—';
function itemRows(headers,list,row){
  if(!list.length) return '<p><em>No items exported yet — run the item export in the editor.</em></p>';
  return '<div class="dbscroll"><table><thead><tr>'+headers.map(h=>`<th>${h}</th>`).join('')+'</tr></thead><tbody>'+
    list.map(it=>'<tr>'+row(it)+'</tr>').join('')+'</tbody></table></div>';
}
function equipmentTable(){
  const list=((ITEMS&&ITEMS.items)||[]).filter(it=>it.type==='Weapon'||it.type==='Armor')
    .sort((a,b)=>a.slotOrder-b.slotOrder||a.name.localeCompare(b.name));
  return itemRows(['Name','Description','Slot','Weapon','Reach','Element','Made of','Forge cost','Card slots','Block chance','Weight','Sells for'],list,it=>
    `<td><strong>${esc(it.name)}</strong></td><td class="long">${descCell(it.description)}</td><td>${esc(it.slot)}</td>`+
    `<td>${esc(dash(it.weaponType))}</td><td>${dash(it.reach)}</td><td>${esc(it.element)}</td><td>${esc(dash(it.madeOf))}</td>`+
    `<td>${it.forgeUnits>0?`${it.forgeUnits} ${esc(it.forgeMaterial)} + ${it.forgeGold} gold`:'—'}</td>`+
    `<td>${dash(it.cardSlots)}</td><td>${esc(dash(it.blockChance))}</td><td>${it.weight}</td><td>${it.zeny} zeny</td>`);
}
function materialTable(){
  const list=((ITEMS&&ITEMS.items)||[]).filter(it=>it.type==='Material')
    .sort((a,b)=>a.materialKindOrder-b.materialKindOrder||a.materialStep-b.materialStep||a.name.localeCompare(b.name));
  // Who drops it, grouped by the chance and count they drop it at, likeliest first — the way /whodrops answers.
  const droppers=it=>{
    const groups={};
    (it.droppedBy||[]).forEach(s=>{const k=s.chance+(s.count!=='1'?' ×'+s.count:'');(groups[k]=groups[k]||[]).push(s);});
    const keys=Object.keys(groups).sort((a,b)=>parseFloat(b)-parseFloat(a));
    return keys.length?keys.map(k=>`<div><strong>${esc(k)}</strong> — `+
      groups[k].sort((a,b)=>a.level-b.level||a.name.localeCompare(b.name)).map(s=>esc(s.name)).join(', ')+'</div>').join(''):'—';
  };
  return itemRows(['Name','Description','Kind','Band / Tier','Merges into','Dropped by','Weight','Sells for'],list,it=>
    `<td><strong>${esc(it.name)}</strong></td><td class="long">${descCell(it.description)}</td><td>${esc(it.materialKind)}</td>`+
    `<td>${it.materialKind==='Ink'||it.materialKind==='Salt'?'Tier':'Band'} ${it.materialStep}</td>`+
    `<td>${esc(dash(it.mergesInto))}</td><td class="long">${droppers(it)}</td><td>${it.weight}</td><td>${it.zeny} zeny</td>`);
}
// Every trademark a forge can roll, and what it raises at each grade.
function trademarkTable(){
  const grades=(ITEMS&&ITEMS.grades)||[], list=(ITEMS&&ITEMS.trademarks)||[];
  return itemRows(['Name','Weapon','Chance'].concat(grades),list,t=>
    `<td><strong>${esc(t.name)}</strong></td><td>${esc(t.weapon)}</td><td>${esc(t.chance)}</td>`+
    (t.byGrade||[]).map(g=>`<td>${(g.lines||[]).length?g.lines.map(l=>`<div>${esc(l)}</div>`).join(''):'—'}</td>`).join(''));
}
// Every armour word, the slot that rolls it, the pieces worn there, and what it does at each grade.
function armorVariantTable(){
  const grades=(ITEMS&&ITEMS.grades)||[];
  const list=((ITEMS&&ITEMS.words)||[]).slice().sort((a,b)=>a.slotOrder-b.slotOrder||a.name.localeCompare(b.name));
  const pieces=slot=>((ITEMS&&ITEMS.items)||[]).filter(it=>it.type==='Armor'&&it.slot===slot).map(it=>esc(it.name)).join(', ')||'—';
  return itemRows(['Variant','Slot','Pieces','Chance'].concat(grades),list,w=>
    `<td><strong>${esc(w.name)}</strong></td><td>${esc(w.slot)}</td><td class="long">${pieces(w.slot)}</td><td>${esc(w.chance)}</td>`+
    (w.byGrade||[]).map(g=>`<td>${esc(g)}</td>`).join(''));
}
function needsSkills(doc){
  return (doc.blocks||[]).some(b=>b&&((b.type==='skillTable'&&b.source)||b.type==='skillDatabase'));
}
// Every exported skill as one table row: the same numbers, description and effect lines the cards print.
function skillDatabase(){
  const all=((SKILLS&&SKILLS.skills)||[]).slice();
  if(!all.length) return '<p><em>No skills exported yet — run the Skill Composer\'s export.</em></p>';
  const order={ultimate:0,active:1,passive:2}, label={ultimate:'Ultimate',active:'Active',passive:'Passive'};
  const colors=SKILLS.weaponColors||{};
  all.sort((a,b)=>a.weapon.localeCompare(b.weapon)||order[skillGroup(a)]-order[skillGroup(b)]||(a.name||'').localeCompare(b.name||''));
  const sym=s=>{const c=colors[s.weapon];const tint=c?` style="color:${esc(c)};border-color:${esc(c)}"`:'';
                return s.symbol?`<span class="sym"${tint}>${esc(s.symbol)}</span>`:'';};
  return '<div class="dbscroll"><table><thead><tr>'+
    ['Name','Description','Weapon','Form','Type','Trigger','MP','CD','Cast','Range','Effects'].map(h=>`<th>${h}</th>`).join('')+
    '</tr></thead><tbody>'+
    all.map(s=>'<tr>'+
      `<td>${sym(s)}<strong>${esc(s.name||s.id)}</strong></td>`+
      // A description is authored as separate lines (a flavour line, then what it does); each keeps its own line.
      `<td class="long">${s.description?String(s.description).split('\n').filter(x=>x.trim()).map(x=>`<div>${inline(x)}</div>`).join(''):'—'}</td>`+
      `<td>${esc(s.weapon)}</td><td>${esc(s.form||'—')}</td>`+
      `<td>${label[skillGroup(s)]}</td><td>${inline(s.trigger||'—')}</td>`+
      `<td>${s.manaCost}</td><td>${s.cooldown}s</td><td>${s.castTime>0?s.castTime+'s':'Instant'}</td>`+
      `<td>${s.castRange>0?s.castRange:'—'}</td>`+
      `<td class="long">${(s.effects||[]).length?'<ul>'+s.effects.map(e=>`<li>${inline(e)}</li>`).join('')+'</ul>':'—'}</td>`+
    '</tr>').join('')+'</tbody></table></div>';
}
// Which bucket a generated skill belongs to. The three are mutually exclusive and come straight from the asset,
// so a skill re-tiered in the Composer moves section on the page by itself.
function skillGroup(s){ return s.ultimate?'ultimate':(s.passive?'passive':'active'); }

function skillTable(b){
  let h='';
  if(b.subtitle) h+=`<p class="skill-sub">${inline(b.subtitle)}</p>`;

  // Generated: pull the weapon's skills out of the export instead of reading hand-typed cards.
  let list=b.skills||[];
  if(b.source){
    const all=(SKILLS&&SKILLS.skills)||[];
    list=all.filter(s=>s.weapon===b.source&&(!b.group||skillGroup(s)===b.group))
            .map(s=>({
              name:s.name,
              form:s.form,
              symbol:s.symbol,
              // The colour belongs to the WEAPON, so it is looked up here rather than repeated on every skill row.
              color:(SKILLS.weaponColors||{})[s.weapon],
              cost:s.cost,
              flavor:s.description,
              // Kept as a LIST, never pre-joined into markup: every text field here goes through inline(), which
              // escapes < and >, so any HTML built into the string would print as literal characters.
              effects:s.effects||[],
              trigger:s.trigger,
              trademark:s.trademark,
              unpublished:!s.published
            }));
    if(!list.length) return h+`<p class="skill-sub"><em>No ${esc(b.group||'')} skills exported for ${esc(b.source)} yet — run the Skill Composer's export.</em></p>`;
  }

  h+='<div class="skillgrid">';
  list.forEach(s=>{
    h+='<div class="skillcard">'+skillIcon(s)+'<div class="body">'+
       `<div class="head"><span class="name">${inline(s.name||'')}</span>`+
       (s.unpublished?'<span class="cost"><em>not in the game yet</em></span>':(s.cost?`<span class="cost">${inline(s.cost)}</span>`:''))+'</div>'+
       // Which form of its weapon's style this is, read from the export — the same line the in-game card shows.
       (s.form?`<div class="flavor"><em>${inline(s.form)}</em></div>`:'')+
       (s.trigger?`<div class="flavor"><strong>${inline(s.trigger)}</strong></div>`:'')+
       // The weapon name this skill is the trademark of, read from the export — never typed on the page.
       (s.trademark?`<div class="flavor">Trademark weapon: <strong>${inline(s.trademark)}</strong></div>`:'')+
       // A description is authored as separate lines (a flavour line, then what it does). HTML collapses newlines,
       // so each line gets its own element rather than being run together into one blob.
       (s.flavor?String(s.flavor).split('\n').filter(x=>x.trim()).map(x=>`<div class="flavor">${inline(x)}</div>`).join(''):'')+
       // Two shapes, one renderer: a generated card carries `effects` (a list, one line per effect); a hand-written
       // card carries a single `effect` string. Each line is escaped on its own — no markup ever rides in the text.
       (s.effects&&s.effects.length
          ?'<ul class="effect">'+s.effects.map(e=>`<li>${inline(e)}</li>`).join('')+'</ul>'
          :(s.effect?`<div class="effect">${inline(s.effect)}</div>`:''))+
       '</div></div>';
  });
  return h+'</div>';
}
function block(b){
  switch(b&&b.type){
    case 'lede':      return `<p class="lede">${inline(b.text)}</p>`;
    case 'heading':   {const n=Math.min(6,Math.max(2,b.level||2));return `<h${n}>${inline(b.text)}</h${n}>`;}
    case 'paragraph': return `<p>${inline(b.text)}</p>`;
    case 'hr':        return '<hr>';
    case 'quote':
    case 'callout':   {const t=Array.isArray(b.text)?b.text:[b.text];return '<blockquote>'+t.map(x=>`<p>${inline(x)}</p>`).join('')+'</blockquote>';}
    case 'list':      {const tag=b.ordered?'ol':'ul';return `<${tag}>`+(b.items||[]).map(x=>`<li>${inline(x)}</li>`).join('')+`</${tag}>`;}
    case 'table':     return '<table><thead><tr>'+(b.headers||[]).map(h=>`<th>${inline(h)}</th>`).join('')+'</tr></thead><tbody>'+
                             (b.rows||[]).map(r=>'<tr>'+r.map(c=>`<td>${inline(c)}</td>`).join('')+'</tr>').join('')+'</tbody></table>';
    case 'image':     return `<figure class="fig"><img src="${esc(b.src)}" alt="${esc(b.alt||'')}">`+(b.caption?`<figcaption>${inline(b.caption)}</figcaption>`:'')+'</figure>';
    case 'skillTable':return skillTable(b);
    case 'skillDatabase':return skillDatabase();
    case 'mobTable':  return mobTable();
    case 'worldMap':  return worldMap();
    case 'elementTable':return elementTable();
    case 'equipmentTable':return equipmentTable();
    case 'materialTable':return materialTable();
    case 'trademarkTable':return trademarkTable();
    case 'armorVariantTable':return armorVariantTable();
    case 'serverStats':return `<div class="livestats" data-from="${esc(b.from||'')}"><p class="loading">Asking the server…</p></div>`;
    // Items draw in array order, top to bottom; an unknown state falls back to planned so a typo never draws a finished dot.
    case 'timeline':  return '<ol class="timeline">'+(b.items||[]).map(it=>{
                        const st=['done','now','planned'].includes(it.state)?it.state:'planned';
                        return `<li class="tl-item tl-${st}"><span class="tl-when">${inline(String(it.when||''))}</span><span class="tl-rail"></span><div class="tl-body">`+
                               (it.title?`<div class="tl-title">${inline(String(it.title))}</div>`:'')+
                               (it.text?`<div class="tl-text">${inline(String(it.text))}</div>`:'')+'</div></li>';
                      }).join('')+'</ol>';
    default:          return '';
  }
}
// ---- live server numbers -----------------------------------------------------------------------------------
//
// A serverStats block draws an EMPTY box (block() is synchronous and cannot wait for a reply). This fills it
// afterwards and keeps filling it, because these numbers go stale while somebody is looking at the page.
//
// The character server works its answer out once every 5 seconds and hands everyone the same copy, so asking
// faster than that cannot produce a newer number — it would only be more requests for the same answer.
const ASK_EVERY_MS = 5000;

// The one timer, held so that leaving the page STOPS it. Without this, every visit to the status page would
// leave another timer running against a box that no longer exists, forever.
let statsTimer = null;
function stopLiveStats(){ if(statsTimer){ clearInterval(statsTimer); statsTimer = null; } }

function num(n){ return (n===null||n===undefined) ? '—' : Number(n).toLocaleString(); }
function ago(seconds){
  if(seconds < 60) return seconds + 's ago';
  const m = Math.floor(seconds/60);
  return m + (m===1 ? ' min ago' : ' mins ago');
}

function statsHtml(d){
  let h = '<div class="tiles">'+
    `<div class="tile"><div class="n">${num(d.playersOnline)}</div><div class="k">Players online</div></div>`+
    `<div class="tile"><div class="n">${num(d.mapsOnline)}</div><div class="k">Maps standing</div></div>`+
    `<div class="tile"><div class="n">${num((d.servers||[]).length)}</div><div class="k">World processes</div></div>`+
    '</div>';

  const servers = d.servers||[];
  h += '<h2>Where the world is running</h2>';
  h += servers.length
    ? '<table><thead><tr><th>Process</th><th>Maps it is holding</th><th>Players</th><th>Creatures</th><th>Last heard</th></tr></thead><tbody>'+
      servers.map(s=>'<tr>'+
        `<td>${esc(s.id||'')}</td>`+
        `<td>${(s.maps||[]).length ? (s.maps||[]).map(esc).join(', ') : '<em>none yet</em>'}</td>`+
        `<td class="num">${num(s.players)}</td>`+
        `<td class="num">${num(s.creatures)}</td>`+
        `<td class="num">${ago(s.lastHeardSecondsAgo||0)}</td>`+
      '</tr>').join('')+'</tbody></table>'
    : '<p><em>No world process is running right now, so nobody can be online.</em></p>';

  const top = d.topPlayers||[];
  h += '<h2>Most experienced adventurers</h2>';
  h += top.length
    ? '<table><thead><tr><th>#</th><th>Name</th><th>Level</th><th>Experience earned</th></tr></thead><tbody>'+
      top.map(p=>'<tr>'+
        `<td class="num">${num(p.rank)}</td>`+
        `<td>${esc(p.name||'')}</td>`+
        `<td class="num">${num(p.level)}</td>`+
        // A character last saved before the game began recording a lifetime total has none. Shown as a dash
        // rather than as 0, because 0 is a real answer somebody can honestly have.
        `<td class="num">${p.lifetimeXp===null||p.lifetimeXp===undefined ? '<em>not recorded</em>' : num(p.lifetimeXp)}</td>`+
      '</tr>').join('')+'</tbody></table>'
    : '<p><em>Nobody has been played yet.</em></p>';

  // What is said here is the SLOWEST link, not this page's own beat — saying "every 5 seconds" beside a player
  // count that a game server only reports twice a minute would be a promise the numbers cannot keep.
  return h + `<p class="asof">Re-read every 5 seconds. A level reaches the database within 15 seconds of being earned, and a world process reports its player count every 30, so those two can be that far behind.</p>`;
}

async function fillLiveStats(box){
  const from = box.dataset.from;
  if(!from){ box.innerHTML = '<p class="down">This page was not told where to read the numbers from.</p>'; return; }
  try{
    const res = await fetch(from, {cache:'no-store'});
    if(!res.ok) throw new Error('the server answered ' + res.status);
    box.innerHTML = statsHtml(await res.json());
  }catch(e){
    // A browser refusing this read across sites throws exactly here, with a message that says nothing useful,
    // so the likely cause is named rather than left for somebody to guess at.
    box.innerHTML = '<p class="down"><strong>Cannot reach the character server.</strong> It may be stopped, or it '+
      'may not be allowing this page to read it (its WIKI_ORIGINS setting).</p>';
  }
}

function startLiveStats(){
  stopLiveStats();
  const boxes = Array.from(document.querySelectorAll('.livestats'));
  if(!boxes.length) return;
  boxes.forEach(fillLiveStats);
  statsTimer = setInterval(()=>boxes.forEach(fillLiveStats), ASK_EVERY_MS);
}

function renderDoc(doc){
  let html = doc.title ? `<h1>${inline(doc.title)}</h1>` : '';
  (doc.blocks||[]).forEach(b=>{ html+=block(b); });
  return html;
}

// ---- app: build nav from manifest, load pages (JSON block documents) ----
let PAGES={};
// ---- generated pages -----------------------------------------------------------------------------------------
// The editor rewrites the generated files whenever the game's data or code changes. A page reads them fresh on every
// visit and nothing more — no timer re-reads them while it is open.
async function ensureGenerated(doc){
  if(needsSkills(doc)) await ensureSkills();
  if(needsMobs(doc)||needsWorld(doc)) await ensureMobs();
  if(needsWorld(doc)) await ensureWorld();
  if(needsElements(doc)) await ensureElements();
  if(needsItems(doc)) await ensureItems();
}
function forgetGenerated(){ SKILLS=null; MOBS=null; WORLD=null; ELEMENTS=null; ITEMS=null; }
async function load(id){
  const p=PAGES[id]; if(!p) return;
  const el=document.getElementById('content');
  // BEFORE the page is replaced: whatever the last page left running is pointed at boxes about to be thrown away.
  stopLiveStats();
  // Every visit to a page reads the generated files afresh — nothing is carried over from the page before.
  forgetGenerated();
  el.innerHTML='<div class="loading">Loading…</div>';
  try{
    const res=await fetch('content/'+p.file,{cache:'no-store'});
    if(!res.ok) throw new Error(res.status);
    const doc=await res.json();
    // A page drawn from generated data needs it in hand before it renders — block() is synchronous.
    await ensureGenerated(doc);
    el.innerHTML=renderDoc(doc);
    wireWorldMap();
    startLiveStats();
  }catch(e){
    el.innerHTML=`<h1>Couldn't load page</h1><p class="lede">${p.file} — ${e.message}</p>`;
  }
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('active',a.dataset.p===id));
  if(location.hash!=='#'+id) history.replaceState(null,'','#'+id);
  window.scrollTo(0,0);
}
async function boot(){
  const man=await (await fetch('content/manifest.json',{cache:'no-store'})).json();
  const nav=document.getElementById('nav');
  let first=null;
  man.groups.forEach(g=>{
    const box=document.createElement('div');box.className='navgroup';
    box.innerHTML=`<h3>${g.title}</h3>`;
    g.pages.forEach(pg=>{
      PAGES[pg.id]=pg; if(!first)first=pg.id;
      const a=document.createElement('a');a.dataset.p=pg.id;
      a.innerHTML=pg.title+(pg.tag?` <span class="tag">${pg.tag}</span>`:'');
      a.addEventListener('click',e=>{e.preventDefault();load(pg.id);});
      box.appendChild(a);
    });
    nav.appendChild(box);
  });
  load((location.hash||'#'+first).slice(1));
}
boot();
</script>
