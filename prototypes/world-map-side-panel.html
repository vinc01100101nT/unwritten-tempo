<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>World Map Layout</title>
<link rel="stylesheet" href="ui-tokens.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--panel-raise); font-family: var(--font-ui); }
  .reader { position: fixed; left: 12px; bottom: 6px; z-index: 5; font: 12px var(--font-ui); color: var(--text-dim); }
  .reader button { font: 12px var(--font-ui); }

  /* the window: the whole screen, the map beside the panel, never under it */
  .map-window { position: fixed; inset: 0 0 28px 0; display: flex; background: var(--panel-fill); color: var(--text-main); }

  .map-window button { font-family: var(--font-ui); }
  .map-area { position: relative; flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .viewport { position: relative; flex: 1; overflow: hidden; cursor: grab; }
  .viewport.dragging { cursor: grabbing; }
  .picture { position: absolute; left: 50%; top: 50%; transform-origin: 0 0; }
  .picture img, .picture canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; user-select: none; -webkit-user-drag: none; }
  .labels { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  /* fades: the patches, the lit patch, the labels and the level ranges ease in and out instead of popping */
  .picture canvas, .labels g { transition: opacity 0.18s ease; }
  .picture canvas.off, .labels g.off { opacity: 0; }
  .footer { height: 28px; display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--text-dim); border-top: 1px solid var(--rule); }

  .corner { position: absolute; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 6px; }
  .btn { background: var(--button-fill); color: var(--button-text); border: 1px solid var(--button-edge); border-radius: 6px;
         font: 13px var(--font-ui); cursor: pointer; transition: background 0.12s; }
  .btn:hover { background: var(--hover); }
  .corner .btn { width: 38px; height: 38px; font-size: 20px; line-height: 1; padding: 0; }
  .pin { display: block; width: 14px; height: 14px; margin: auto; border-radius: 50% 50% 50% 0; transform: rotate(-45deg);
         background: var(--accent); }

  /* the panel */
  .panel { width: 300px; flex: none; display: flex; flex-direction: column; border-left: 1px solid var(--window-edge);
           background: var(--panel-fill); transition: width 0.15s; }
  .panel.folded { width: 28px; }
  .panel.folded .panel-body { display: none; }
  .fold { height: 28px; width: 100%; border: 0; border-bottom: 1px solid var(--rule); background: var(--panel-raise);
          color: var(--text-dim); cursor: pointer; font-size: 14px; text-align: left; padding: 0 9px; }
  .fold:hover { background: var(--hover); }
  .panel-body { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .head { padding: 10px 14px 12px; border-bottom: 1px solid var(--rule); }
  .title { font-size: 22px; color: var(--title-text); }
  .where { font-size: 14px; color: var(--text-dim); margin-top: 2px; }
  .head-buttons { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .head-buttons .btn { height: 28px; padding: 0 10px; }

  .list { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 0 10px; }
  .section { font-size: 14px; color: var(--title-text); padding: 10px 14px 4px; position: sticky; top: -4px; background: var(--panel-fill); }
  .row { display: grid; grid-template-columns: 1fr 52px 36px; align-items: baseline; gap: 6px; padding: 3px 14px; font-size: 13px; }
  .row:hover { background: var(--hover); }
  .row .lv, .row .count { text-align: right; color: var(--text-dim); font-variant-numeric: tabular-nums; }
  .none { padding: 3px 14px; font-size: 13px; color: var(--text-dim); }
  @keyframes rowin { from { opacity: 0; transform: translateY(4px); } }
  .list .row, .list .none, .tip .row { animation: rowin 0.2s ease both; }

  /* the patch under the mouse: what the world keeps there, never what is alive */
  .tip { position: fixed; z-index: 4; min-width: 230px; padding: 4px 0; pointer-events: none;
         opacity: 0; visibility: hidden; transition: opacity 0.12s, visibility 0s 0.12s;
         background: var(--panel-fill); border: 1px solid var(--window-edge); border-radius: 6px; color: var(--text-main); }
  .tip .row:hover { background: none; }
  .tip.on { opacity: 1; visibility: visible; transition: opacity 0.12s; }
</style>
</head>
<body>

<div class="map-window" data-mocks="Map">
  <div class="map-area">
    <div class="viewport" id="viewport">
      <div class="picture" id="picture">
        <img id="img" src="../unity/Assets/3_Data/Resources/Minimaps/world.png" alt="">
        <canvas id="patchCanvas" class="off"></canvas>
        <canvas id="hoverCanvas" class="off"></canvas>
      </div>
      <svg class="labels" id="labels" xmlns="http://www.w3.org/2000/svg"><g id="rangeLayer" class="off"></g><g id="labelLayer"></g></svg>
      <div class="corner">
        <button class="btn" id="zin">+</button>
        <button class="btn" id="zout">&minus;</button>
        <button class="btn" id="home"><span class="pin"></span></button>
      </div>
    </div>
    <div class="footer">[M] / [Esc] to close</div>
  </div>

  <div class="tip" id="tip"></div>

  <div class="panel" id="panel">
    <button class="fold" id="fold">&#x203A;</button>
    <div class="panel-body">
      <div class="head">
        <div class="title">world</div>
        <div class="where" id="where"></div>
        <div class="head-buttons">
          <button class="btn" id="patches">Show respawn patches</button>
          <button class="btn" id="labelsBtn">Hide map labels</button>
        </div>
      </div>
      <div class="list" id="list"></div>
    </div>
  </div>
</div>

<div class="reader">
  Not drawn here, kept as the game draws them on the map: you, the quest route, townsfolk, the picked spot.
  Hovering a creature still opens its card. &nbsp;
  <button id="move">Stand somewhere else</button>
  <button id="theme">Light / dark</button>
</div>

<script>
// Read from the game's own files (2026-10-30): every respawn patch of the world inside the world picture, with the
// creatures and how many of each the world keeps there (WorldSpawns), and the world layout's towns, landmarks, caves
// and dungeon doors. Nothing here is a live count.
const D = JSON.parse(document.getElementById("data").textContent);
const [MX, MZ, SIZE] = D.picture, SQ = 4;

// The patches: each square of ground (4 units) points at its patch.
const owner = new Map();
D.patches.forEach((p, i) => {
  let sx = 0, sz = 0, n = 0, lo = Infinity, hi = -Infinity;
  for (let k = 0; k < p.sq.length; k += 2) { owner.set(p.sq[k] + "," + p.sq[k + 1], i); sx += p.sq[k]; sz += p.sq[k + 1]; n++; }
  for (const m of p.mobs) { lo = Math.min(lo, m[1]); hi = Math.max(hi, m[1]); }
  p.mid = [sx / n + SQ / 2, sz / n + SQ / 2]; p.n = n; p.range = lo === hi ? "Lv " + lo : "Lv " + lo + "–" + hi;
});
const patchAt = (x, z) => owner.get(Math.floor(x / SQ) * SQ + "," + Math.floor(z / SQ) * SQ);

// Where you stand: three spots to try — two patches (one with an elite) and Lastline, which is no patch.
const spots = [[-10, -58, 0], [42, -182, -12], [0, 0, 0]];
let spot = 0;

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function mobRows(into, mobs) {
  for (const [k, [name, lv, kept]] of mobs.entries()) {
    const r = el("div", "row"); r.style.animationDelay = k * 25 + "ms";
    r.append(el("span", "name", name), el("span", "lv", "Lv " + lv), el("span", "count", kept ? "×" + kept : ""));
    into.append(r);
  }
}
function showHere() {
  const [x, z, y] = spots[spot];
  document.getElementById("where").textContent = `X ${x} Y ${z} Z ${y}`;
  const list = document.getElementById("list"); list.textContent = "";
  list.append(el("div", "section", "Mobs"));
  const i = patchAt(x, z);
  if (i == null) list.append(el("div", "none", "No mobs here")); else mobRows(list, D.patches[i].mobs);
}

// The map: fits the room beside the panel; the wheel zooms toward the cursor, a zoomed map drags, and never past its edges.
const vp = document.getElementById("viewport"), pic = document.getElementById("picture"), img = document.getElementById("img");
const patchCanvas = document.getElementById("patchCanvas"), hoverCanvas = document.getElementById("hoverCanvas");
const MAX_ZOOM = 4, PER_NOTCH = 1.2;
let zoom = 1, pan = { x: 0, y: 0 }, base = 1, showPatches = false, showLabels = true, hovered = null;
// Smooth zoom: zoom and pan are where the view is going; `shown` is where it is drawn this frame, easing there in
// about EASE_MS (zoom on a log scale, the map point at the middle in a straight line, so nothing swims sideways).
const EASE_MS = 70;
let shown = { z: 1, x: 0, y: 0 }, frame = 0, lastT = null, pointer = null;
function fit() {
  const w = vp.clientWidth, h = vp.clientHeight, iw = img.naturalWidth || 2048, ih = img.naturalHeight || 2048;
  base = Math.min(w / iw, h / ih);
  pic.style.width = iw * base + "px"; pic.style.height = ih * base + "px";
  for (const c of [patchCanvas, hoverCanvas]) { c.width = iw; c.height = ih; }
  paintPatches(); paintHover(false); clamp(); snap();
}
function clamp() {
  const w = vp.clientWidth, h = vp.clientHeight, pw = pic.offsetWidth * zoom, ph = pic.offsetHeight * zoom;
  const mx = Math.max(0, (pw - w) / 2), my = Math.max(0, (ph - h) / 2);
  pan.x = Math.min(mx, Math.max(-mx, pan.x)); pan.y = Math.min(my, Math.max(-my, pan.y));
}
function paint() {
  pic.style.transform = `translate(${shown.x - pic.offsetWidth * shown.z / 2}px, ${shown.y - pic.offsetHeight * shown.z / 2}px) scale(${shown.z})`;
  drawLabels();
  if (pointer && !drag) hover(pointer);
}
function snap() { cancelAnimationFrame(frame); frame = 0; lastT = null; shown = { z: zoom, x: pan.x, y: pan.y }; paint(); }
function draw() { if (!frame) frame = requestAnimationFrame(step); }
function step(now) {
  const k = lastT == null ? 0.35 : 1 - Math.exp(-Math.min(50, now - lastT) / EASE_MS); lastT = now;
  const z = Math.exp(Math.log(shown.z) + (Math.log(zoom) - Math.log(shown.z)) * k);
  const cx = -shown.x / shown.z, cy = -shown.y / shown.z;
  const nx = cx + (-pan.x / zoom - cx) * k, ny = cy + (-pan.y / zoom - cy) * k;
  shown = { z, x: -nx * z, y: -ny * z };
  const done = Math.abs(shown.z - zoom) < 1e-3 && Math.abs(shown.x - pan.x) < 0.3 && Math.abs(shown.y - pan.y) < 0.3;
  if (done) { shown = { z: zoom, x: pan.x, y: pan.y }; frame = 0; lastT = null; } else frame = requestAnimationFrame(step);
  paint();
}
function zoomAt(cx, cy, notches) {
  const next = Math.min(MAX_ZOOM, Math.max(1, zoom * Math.pow(PER_NOTCH, notches)));
  if (next === zoom) return;
  const r = vp.getBoundingClientRect(), px = cx - r.left - r.width / 2, py = cy - r.top - r.height / 2;
  pan.x = px - (px - pan.x) * next / zoom; pan.y = py - (py - pan.y) * next / zoom; zoom = next;
  clamp(); draw();
}

// Map coordinates <-> the picture's pixels and the screen.
function toPicture(x, z) { const s = patchCanvas.width / SIZE; return [(x - MX) * s, (MZ + SIZE - z) * s]; }
function toScreen(x, z) {
  const r = pic.getBoundingClientRect(), v = vp.getBoundingClientRect();
  return [r.left - v.left + (x - MX) / SIZE * r.width, r.top - v.top + (MZ + SIZE - z) / SIZE * r.height];
}
function fromScreen(cx, cy) {
  const r = pic.getBoundingClientRect();
  return [MX + (cx - r.left) / r.width * SIZE, MZ + SIZE - (cy - r.top) / r.height * SIZE];
}
const layoutToMap = (lx, ly) => [lx - 640, 640 - ly];

// A patch painted the way the game paints it: one point-filtered pixel per square of ground, a light fill, and a dark
// square wherever the patch meets ground that is not its own.
const GX = Math.floor(MX / SQ) * SQ, GZ = Math.floor(MZ / SQ) * SQ, CELLS = Math.ceil((MX + SIZE - GX) / SQ) + 1;
function paintPatch(ctx, i, colour, edge) {
  const p = D.patches[i], mask = document.createElement("canvas"); mask.width = mask.height = CELLS;
  const m = mask.getContext("2d");
  for (let k = 0; k < p.sq.length; k += 2) {
    const x = p.sq[k], z = p.sq[k + 1];
    const rim = patchAt(x - SQ, z) !== i || patchAt(x + SQ, z) !== i || patchAt(x, z + SQ) !== i || patchAt(x, z - SQ) !== i;
    m.fillStyle = rim ? edge : colour;
    m.fillRect((x - GX) / SQ, CELLS - 1 - (z - GZ) / SQ, 1, 1);
  }
  const [px, py] = toPicture(GX, GZ + CELLS * SQ), s = patchCanvas.width / SIZE * SQ * CELLS;
  ctx.imageSmoothingEnabled = false; ctx.drawImage(mask, px, py, s, s);
}
function rgba(hex, a, f = 1) {
  const v = parseInt(hex.slice(1), 16), c = n => Math.round((v >> n & 255) * f);
  return `rgba(${c(16)}, ${c(8)}, ${c(0)}, ${a})`;
}
const token = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function fadeIn(e) { e.style.transition = "none"; e.classList.add("off"); void e.offsetWidth; e.style.transition = ""; e.classList.remove("off"); }
function paintPatches() {
  patchCanvas.classList.toggle("off", !showPatches);
  if (!showPatches) return;
  const ctx = patchCanvas.getContext("2d"); ctx.clearRect(0, 0, patchCanvas.width, patchCanvas.height);
  const colours = { original: token("--good"), tainted: token("--rarity-epic"), blighted: token("--bad") };
  D.patches.forEach((p, i) => paintPatch(ctx, i, rgba(colours[p.v], 0.35), rgba(colours[p.v], 0.85, 0.45)));
}
function paintHover(fade = true) {
  if (hovered == null) { hoverCanvas.classList.add("off"); return; }
  const ctx = hoverCanvas.getContext("2d"); ctx.clearRect(0, 0, hoverCanvas.width, hoverCanvas.height);
  paintPatch(ctx, hovered, rgba(token("--accent"), 0.45), rgba(token("--accent"), 1));
  if (fade) fadeIn(hoverCanvas); else hoverCanvas.classList.remove("off");
}

// The map labels, drawn in the world layout's own style at a fixed size on screen; the level ranges of the patches
// with the patches. Each is its own layer, placed on its own: every label is drawn, a range that would sit on another
// range is left out (the biggest patches first), and a label never moves a range,
// so showing or hiding the labels leaves the ranges exactly where they were. The labels draw over the ranges.
const NS = "http://www.w3.org/2000/svg";
const rangeLayer = document.getElementById("rangeLayer"), labelLayer = document.getElementById("labelLayer");
let layer = labelLayer;
function add(tag, attrs, text) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text != null) e.textContent = text;
  layer.append(e); return e;
}
const inPicture = (x, z) => x >= MX && x <= MX + SIZE && z >= MZ && z <= MZ + SIZE;
function drawLabels() {
  rangeLayer.textContent = ""; labelLayer.textContent = "";
  rangeLayer.classList.toggle("off", !showPatches); labelLayer.classList.toggle("off", !showLabels);
  let taken = [];
  const free = b => !taken.some(o => b[0] < o[2] && o[0] < b[2] && b[1] < o[3] && o[1] < b[3]);
  const box = (x, y, size, text) => { const w = 0.58 * size * text.length + 4; return [x - w / 2, y - size, x + w / 2, y + 3]; };
  const name = { "text-anchor": "middle", "paint-order": "stroke", style: "font-family: var(--font-label)" };
  // a sign the labels' face lacks (the star, the door) is drawn in the interface face, as the game does
  const sign = { "text-anchor": "middle", "paint-order": "stroke", style: "font-family: var(--font-label), var(--font-ui)" };
  layer = labelLayer;
  {
    for (const [lx, ly] of D.labels.doors) {
      const [x, z] = layoutToMap(lx, ly); if (!inPicture(x, z)) continue; const [sx, sy] = toScreen(x, z);
      add("text", { ...sign, x: sx, y: sy + 7, "font-size": 20, fill: "#2a1a0a", stroke: "#fff", "stroke-width": 1 }, "▼");
      taken.push([sx - 8, sy - 8, sx + 8, sy + 8]);
    }
    for (const [lx, ly] of D.labels.caves) {
      const [x, z] = layoutToMap(lx, ly); if (!inPicture(x, z)) continue; const [sx, sy] = toScreen(x, z);
      add("rect", { x: sx - 11, y: sy - 9, width: 22, height: 19, rx: 9.5, fill: "#1d1712", stroke: "#e8e0d0", "stroke-width": 2 });
      add("text", { ...name, x: sx, y: sy + 24, "font-size": 12, fill: "#fff", stroke: "#000", "stroke-width": 2 }, "cave");
      taken.push([sx - 12, sy - 10, sx + 12, sy + 27]);
    }
    for (const [label, lx, ly] of D.labels.landmarks) {
      const [x, z] = layoutToMap(lx, ly); if (!inPicture(x, z)) continue; const [sx, sy] = toScreen(x, z);
      add("text", { ...sign, x: sx, y: sy + 8, "font-size": 24, fill: "#ffd34d", stroke: "#5a3d00", "stroke-width": 1 }, "★");
      add("text", { ...name, x: sx, y: sy + 25, "font-size": 13, fill: "#1d1d1d", stroke: "#fff", "stroke-width": 3 }, label);
      taken.push([sx - 10, sy - 10, sx + 10, sy + 10], box(sx, sy + 25, 13, label));
    }
    for (const [label, lx, ly] of D.labels.towns) {
      const [x, z] = layoutToMap(lx, ly); if (!inPicture(x, z)) continue; const [sx, sy] = toScreen(x, z);
      add("circle", { cx: sx, cy: sy, r: 12, fill: "#fff", stroke: "#222", "stroke-width": 3 });
      add("text", { ...name, x: sx, y: sy - 18, "font-size": 17, "font-weight": 700, fill: "#111", stroke: "#fff", "stroke-width": 3 }, label);
      taken.push([sx - 14, sy - 14, sx + 14, sy + 14], box(sx, sy - 18, 17, label));
    }
  }
  layer = rangeLayer; taken = [];
  {
    const order = D.patches.map((p, i) => i).sort((a, b) => D.patches[b].n - D.patches[a].n);
    const vw = vp.clientWidth, vh = vp.clientHeight;
    for (const i of order) {
      const p = D.patches[i], [sx, sy] = toScreen(...p.mid);
      if (sx < 0 || sy < 0 || sx > vw || sy > vh) continue;
      const b = box(sx, sy + 4, 12, p.range); if (!free(b)) continue; taken.push(b);
      add("text", { x: sx, y: sy + 4, "text-anchor": "middle", "paint-order": "stroke", style: "font-family: var(--font-ui)",
                    "font-size": 12, fill: token("--text-main"), stroke: token("--panel-fill"), "stroke-width": 3 }, p.range);
    }
  }
}

// Hovering the map lights the patch under the mouse and lists what the world keeps there.
const tip = document.getElementById("tip");
function hover(e) {
  pointer = e && e.clientX != null ? { clientX: e.clientX, clientY: e.clientY, target: e.target } : null;
  let i = null;
  if (!drag && e && vp.contains(e.target) && !e.target.closest(".corner")) i = patchAt(...fromScreen(e.clientX, e.clientY));
  if (i == null) i = null;
  if (i !== hovered) {
    hovered = i; paintHover();
    tip.textContent = "";
    if (i != null) mobRows(tip, D.patches[i].mobs);
  }
  tip.classList.toggle("on", i != null);
  if (i != null) {
    const w = tip.offsetWidth, h = tip.offsetHeight;
    tip.style.left = Math.min(e.clientX + 16, innerWidth - w - 4) + "px";
    tip.style.top = Math.min(e.clientY + 16, innerHeight - h - 4) + "px";
  }
}

vp.addEventListener("wheel", e => { e.preventDefault(); zoomAt(e.clientX, e.clientY, e.deltaY < 0 ? 1 : -1); hover(e); }, { passive: false });
let drag = null;
vp.addEventListener("mousedown", e => { if (e.target.closest(".corner")) return; zoom = shown.z; pan = { x: shown.x, y: shown.y }; snap(); drag = { x: e.clientX - pan.x, y: e.clientY - pan.y }; vp.classList.add("dragging"); hover(null); });
addEventListener("mousemove", e => { if (drag) { pan.x = e.clientX - drag.x; pan.y = e.clientY - drag.y; clamp(); snap(); } else hover(e); });
addEventListener("mouseup", e => { drag = null; vp.classList.remove("dragging"); hover(e); });
vp.addEventListener("mouseleave", () => { if (!drag) hover(null); });
function centre() { const r = vp.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; }
document.getElementById("zin").onclick = () => zoomAt(...centre(), 1);
document.getElementById("zout").onclick = () => zoomAt(...centre(), -1);
document.getElementById("home").onclick = () => { zoom = 1; pan = { x: 0, y: 0 }; clamp(); draw(); };
document.getElementById("fold").onclick = () => {
  const p = document.getElementById("panel"); p.classList.toggle("folded");
  document.getElementById("fold").innerHTML = p.classList.contains("folded") ? "&#x2039;" : "&#x203A;";
  setTimeout(fit, 160);
};
const patchesBtn = document.getElementById("patches"), labelsBtn = document.getElementById("labelsBtn");
patchesBtn.onclick = () => {
  showPatches = !showPatches; patchesBtn.textContent = showPatches ? "Hide respawn patches" : "Show respawn patches";
  paintPatches(); drawLabels();
};
labelsBtn.onclick = () => {
  showLabels = !showLabels; labelsBtn.textContent = showLabels ? "Hide map labels" : "Show map labels"; drawLabels();
};
document.getElementById("move").onclick = () => { spot = (spot + 1) % spots.length; showHere(); };
document.getElementById("theme").onclick = () => {
  const root = document.documentElement; root.dataset.theme = root.dataset.theme === "dark" ? "light" : "dark";
  paintPatches(); paintHover(false); drawLabels();
};
showHere();
img.complete ? fit() : img.addEventListener("load", fit);
addEventListener("resize", fit);
</script>
</body>
</html>
