<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login</title>
<link rel="stylesheet" href="ui-tokens.css">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0d0e10; font-family: var(--font-ui); }
  .win { width: 430px; background: var(--window-edge); padding: 2px; border-radius: 5px; }
  .fill { background: var(--panel-fill); border-radius: 4px; overflow: hidden; }
  .head { height: 32px; display: flex; align-items: center; padding: 0 14px;
          background: linear-gradient(var(--title-bar-top), var(--title-bar-bottom));
          color: var(--title-text); font: 700 14px var(--font-ui); }
  .inner { padding: 18px 24px 22px; }
  .line { text-align: center; font: italic 14px var(--font-ui); color: var(--text-dim); margin: 0 0 18px; }
  .cap { font: 13px var(--font-ui); color: var(--text-dim); margin: 0 0 3px; }
  .field { height: 32px; border: 1px solid var(--button-edge); border-radius: 3px; background: var(--slot-fill);
           display: flex; align-items: center; padding: 0 8px; font: 14px var(--font-ui); color: var(--text-main); margin-bottom: 14px; }
  .status { height: 18px; text-align: center; font: 13px var(--font-ui); color: var(--title-text); margin: 4px 0 10px; }
  .actions { display: flex; justify-content: center; gap: 20px; }
  button { width: 140px; height: 34px; font: 14px var(--font-ui); color: var(--button-text); background: var(--button-fill);
           border: 1px solid var(--button-edge); border-radius: 3px; cursor: pointer; }
  button:hover { background: var(--hover); border-color: var(--accent); }
</style>
</head>
<body>
<section class="win" data-mocks="Sign In">
  <div class="fill">
    <div class="head">Login</div>
    <div class="inner">
      <p class="line">Sign in to continue</p>
      <p class="cap">Account</p><div class="field">ariona</div>
      <p class="cap">Password</p><div class="field">••••••••</div>
      <div class="status"></div>
      <div class="actions"><button>Enter</button><button>New Account</button></div>
    </div>
  </div>
</section>
</body>
</html>
