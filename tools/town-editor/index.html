<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Town Editor</title>
<style>
:root{--bg:#1d2024;--panel:#262a30;--line:#3a4048;--text:#e6e8eb;--dim:#9aa3ad;--accent:#e79bc0;--warn:#f0b24a;--bad:#e5534b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px/1.4 system-ui,sans-serif}
#app{display:grid;grid-template-columns:150px 1fr 290px;grid-template-rows:auto 1fr auto;height:100%}
header{grid-column:1/4;display:flex;gap:8px;align-items:center;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
header .grow{flex:1}
#tools{background:var(--panel);border-right:1px solid var(--line);padding:6px;display:flex;flex-direction:column;gap:3px;overflow:auto}
#tools button{text-align:left}
#tools button.on{background:var(--accent);color:#222;border-color:var(--accent)}
#stage{position:relative;overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none}
#side{background:var(--panel);border-left:1px solid var(--line);padding:8px;overflow:auto}
footer{grid-column:1/4;padding:3px 10px;background:var(--panel);border-top:1px solid var(--line);color:var(--dim);display:flex;gap:16px;flex-wrap:wrap}
button,select,input{font:inherit;color:var(--text);background:#30353c;border:1px solid var(--line);border-radius:4px;padding:3px 7px}
button:hover{border-color:var(--accent)}
button:disabled{opacity:.5}
input[type=number]{width:72px}
input[type=text]{width:100%}
label{display:flex;gap:6px;align-items:center}
h3{margin:10px 0 4px;font-size:13px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em}
.row{display:flex;gap:6px;align-items:center;margin:3px 0;flex-wrap:wrap}
.row>span:first-child{min-width:70px;color:var(--dim)}
#opts{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#warnings div{padding:2px 4px;border-radius:3px;cursor:pointer;color:var(--warn)}
#warnings div:hover{background:#333a42}
#report{white-space:pre-wrap;font:11px/1.35 ui-monospace,monospace;max-height:240px;overflow:auto;background:#1a1d21;padding:6px;border-radius:4px;display:none}
.dirty{color:var(--warn)}
.ok{color:#8fd18f}
.bad{color:var(--bad)}
[hidden]{display:none!important}
#stage.split{display:grid;grid-template-columns:1fr 1fr;gap:2px}
header button.on{background:var(--accent);color:#222;border-color:var(--accent)}
kbd{background:#30353c;border:1px solid var(--line);border-radius:3px;padding:0 4px;font-size:11px}
</style></head>
<body><div id="app">
<header>
  <select id="town"></select>
  <select id="newTown" title="Start a plan for a town on the world map that has none yet"></select>
  <span id="townInfo"></span>
  <span class="grow"></span>
  <span id="state"></span>
  <button id="undo" title="Ctrl+Z">Undo</button><button id="redo" title="Ctrl+Y">Redo</button>
  <button id="save" title="Ctrl+S">Save</button><button id="view3d" title="The town from the game camera's angle, beside the top-down view">3D view</button><button id="pictures">Take pictures</button><button id="rebuild">Rebuild in Unity</button>
</header>
<div id="tools">
  <button data-tool="select">Select / move <kbd>V</kbd></button>
  <button data-tool="height">Ground height <kbd>H</kbd></button>
  <button data-tool="street">Draw street <kbd>S</kbd></button>
  <button data-tool="canal">Draw canal <kbd>C</kbd></button>
  <button data-tool="wall">Draw wall <kbd>W</kbd></button>
  <button data-tool="area">Draw area <kbd>A</kbd></button>
  <button data-tool="bridge">Add bridge <kbd>B</kbd></button>
  <button data-tool="gate">Add gate <kbd>G</kbd></button>
  <button data-tool="place">Place piece <kbd>P</kbd></button>
  <button data-tool="plants">Paint plants <kbd>N</kbd></button>
  <h3>Show</h3>
  <label><input type="checkbox" id="showPictures" checked>Pictures</label>
  <label><input type="checkbox" id="showThrough">See-through pieces</label>
  <label><input type="checkbox" id="showPlants" checked>Plants</label>
  <label><input type="checkbox" id="showHeights" checked>Heights</label>
  <label><input type="checkbox" id="showCurbs" checked>Curbs</label>
  <label><input type="checkbox" id="showLabels" checked>Names</label>
  <label><input type="checkbox" id="showPieces" checked>Pieces</label>
  <label><input type="checkbox" id="showLeaves">Floating leaves</label>
  <h3>Keys</h3>
  <div style="color:var(--dim);font-size:12px">
  Drag: move · <kbd>Shift</kbd>: add to selection · drag empty: box select · right-drag or <kbd>Space</kbd>: pan · wheel: zoom ·
  double-click a line: add a point · <kbd>Del</kbd>: delete · <kbd>R</kbd>/<kbd>E</kbd>: turn (Shift: 1°) · <kbd>Ctrl+D</kbd>: duplicate ·
  <kbd>Enter</kbd>: finish a line · <kbd>Esc</kbd>: cancel · <kbd>F</kbd>: fit
  </div>
</div>
<div id="stage"><canvas id="cv"></canvas><canvas id="cv3" hidden></canvas></div>
<div id="side">
  <div id="opts"></div>
  <h3>Selected</h3><div id="inspector"></div>
  <h3>Problems <span id="nWarn"></span></h3><div id="warnings"></div>
  <h3>Last rebuild</h3><div id="report"></div>
</div>
<footer><span id="cursor"></span><span id="hint"></span></footer>
</div>
<script src="/view3d.js"></script>
<script>
"use strict";
// ---- the town's frame, as the town tools and the town builder have it ------------------------------------------------
const HALF_X = 24.5, HALF_Z = 31.0, WALL_DEEP = 0.61, BRIDGE_LAND = 1.0, ROCK_L = 12.31, ROCK_W = 6.54, LIFT_STEP = 0.5;
const LOOKS = {pit: "#6b4a2b", planter: "#6b4a2b", water: "#5aa7d6", stone: "#c9c3b8", street: "#ecdcbc", court: "#e6cfd3",

const ROLE_COLOURS = {house: "#b07a4a", landmark: "#8a62c4", market: "#c9a24a", tree: "#e79bc0", bush: "#c4507a", effect: "#ffffff"};

const $ = id => document.getElementById(id);
const cv = $("cv");
let ctx = cv.getContext("2d");   // the ground is drawn through it into a picture of its own (drawGroundCached)

let town = null, plan = null, variants = {}, kit = {}, pictures = {}, tileNames = [];

let view = {cx: 0, cz: 0, s: 12};

const opts = {streetWidth: 2.0, canalWidth: 2.4, areaShape: "rect", areaLook: "grass", kind: null, variant: 1,

let imagesLoaded = 0;
// `loaded` runs when it arrives: by default the top-down view is redrawn, its ground picture included.

}
const patterns = new Map();
function tileOf(name) { return (plan.tiles || []).find(t => t.name === name); }

function tileFill(name, look, on = ctx) {

  if (!img) return LOOKS[look] || "#888";

  const mine = patterns.get(on) || (patterns.set(on, {}), patterns.get(on));

  const img = image(`/pictures/${town}/${e.file}`); if (!img) return false;
  ctx.save(); ctx.translate(X(x), Y(z)); ctx.rotate(rot * Math.PI / 180);
  const s = view.s * scale; ctx.drawImage(img, e.x0 * s, -e.z1 * s, (e.x1 - e.x0) * s, (e.z1 - e.z0) * s);
  ctx.restore(); return true;
}
// A tree, bush or plant as the game camera sees it (its leaves hang as upright cards, which straight down shows edge-on):

  const img = image(`/pictures/${town}/${e.file}`); if (!img) return false;

const pairs = xz => { const out = []; for (let k = 0; k + 1 < xz.length; k += 2) out.push([xz[k], xz[k + 1]]); return out; };
// AN AREA'S OUTLINE, the town builder's Outline: straight from point to point, curving through every point marked smooth
// (Shift held while dragging it) — a smooth point is left along the line through its two neighbours, a sharp one straight
// at the next point, each curved side in CURVE_STEPS runs.

      const mb = S(i + 1) ? [(P(i + 2)[0] - P(i)[0]) / 2, (P(i + 2)[1] - P(i)[1]) / 2] : [b0[0] - a0[0], b0[1] - a0[1]];
      for (let k = 1; k < CURVE_STEPS; k++) {

}
function inArea(a, x, z) {

  if (a.circle && a.circle.length === 3) return (x - a.circle[0]) ** 2 + (z - a.circle[1]) ** 2 <= a.circle[2] ** 2;

}
const wallLine = () => plan.wall.line;

// The look under a point as the plan lays it (the town builder's own order): lawn past the wall, then the areas, then the
// streets, the court over them. Used to work out the trees' soil beds, exactly as the town builder does.
function lookAt(areas, x, z) {
  const line = wallLine();
  let c = "grass";
  if (!(Math.abs(x) > HALF_X - line || Math.abs(z) > HALF_Z - line)) for (const a of areas) if (inArea(a, x, z)) c = a.look;
  for (const s of plan.streets) if (lineDist(s.xz, x, z) <= s.width / 2) c = "street";
  for (const a of areas) if (a.look === "court" && inArea(a, x, z)) c = "court";

function builtLook(areas, x, z) {
  const line = wallLine();

  for (const m of plan.mounds) if (inPoly(moundBox(m), x, z)) c = "grass";
  for (const s of plan.streets) if (lineDist(s.xz, x, z) <= s.width / 2) c = "street";
  for (const a of areas) if (a.look === "court" && inArea(a, x, z)) c = "court";

    if (look !== "stone" && look !== "court" && look !== "street") continue;

}
const beds = () => bedsAndAreas().beds;

// Worked out in slices of about 15 ms, and only once nothing is being dragged or painted, so the page never stalls; a
// change while it runs starts it again.
function curbs() {

  return curbCache.segs;
}
function startTrace() {
  curbTimer = 0;

  const v = version, job = traceCurbs();

  const slice = () => {

  });

    const A = foot[a], B = foot[b];
    if ((A.role === "tree" || A.role === "bush") && (B.role === "tree" || B.role === "bush")) continue;
    if (overlap(A.poly, B.poly)) problems.push({text: `${A.p.kind} overlaps ${B.p.kind}`, at: {t: "piece", i: A.i}});
  }
  const box = $("warnings"); box.innerHTML = ""; $("nWarn").textContent = problems.length ? `(${problems.length})` : "";
  if (!problems.length) box.append(el("div", {textContent: "None.", style: "color:#8fd18f;cursor:default"}));
  for (const q of problems.slice(0, 200)) box.append(el("div", {textContent: q.text, onclick: () => {
    sel = [q.at]; const o = objOf(q.at); view.cx = o.x; view.cz = o.z; view.s = Math.max(view.s, 30); inspect(); draw(); }}));
}

// ---- loading, saving, rebuilding ------------------------------------------------------------------------------------
function hint(t) { $("hint").textContent = t; }
function refreshState() {
  $("state").textContent = dirty ? "Not saved" : "Saved"; $("state").className = dirty ? "dirty" : "ok";
  $("undo").disabled = !undoStack.length; $("redo").disabled = !redoStack.length;
}
async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  const j = await r.json(); if (!r.ok) throw new Error(j.error || r.statusText); return j;
}
async function load(id) {
  if (dirty && !confirm("This town has changes that are not saved. Leave them?")) { $("town").value = town; return; }
  const j = await api("/api/plan?id=" + encodeURIComponent(id));
  town = id; plan = j.plan; variants = j.variants;
  pictures = await api("/api/pictures?id=" + encodeURIComponent(id));
  patterns.clear();
  for (const key of ["areas", "streets", "canals", "walls", "bridges", "mounds", "gates", "pieces"]) plan[key] = plan[key] || [];
  kit = {}; for (const k of plan.kit) kit[k.kind] = k;
  plan.tiles = plan.tiles || []; plan.plants = plan.plants || []; decodePlants();
  undoStack = []; redoStack = []; sel = []; dirty = false; version++;
  $("townInfo").textContent = `${plan.name} — ${plan.weapon}, ${plan.theme}`;
  refreshState(); setTool(tool); fit(); inspect(); runCheck();
  // pictures missing, or taken of other pieces than the plan places: Unity photographs them now
  if (!pictures.current) takePictures();
}
async function save() {
  if (!plan) return;
  try { tidy(); encodePlants(); await api("/api/plan?id=" + encodeURIComponent(town), plan); dirty = false; refreshState(); hint("Saved."); }
  catch (err) { alert("Not saved: " + err.message); }
}
async function rebuild() {
  if (!plan) return;
  if (dirty) await save(); if (dirty) return;
  if (!confirm(`Rebuild ${plan.name} and the world around it in the open Unity editor?\n\nIt takes a few minutes, and Unity must not be in Play mode. ${plan.name}'s piece is replaced by what the plan says. Afterwards the game server must be rebuilt and restarted before players see it.`)) return;
  const btn = $("rebuild"), rep = $("report"); btn.disabled = true; btn.textContent = "Rebuilding…";
  rep.style.display = "block"; rep.className = ""; rep.textContent = "Building — this takes a few minutes…";
  try { const j = await api("/api/rebuild?id=" + encodeURIComponent(town), {}); rep.textContent = j.report; rep.className = /FAIL/.test(j.report) ? "bad" : ""; }
  catch (err) { rep.textContent = "Not rebuilt: " + err.message; rep.className = "bad"; }
  btn.disabled = false; btn.textContent = "Rebuild in Unity";
}
async function takePictures() {
  if (!plan) return;
  const btn = $("pictures"), rep = $("report"); btn.disabled = true; btn.textContent = "Taking pictures…";
  rep.style.display = "block"; rep.className = ""; rep.textContent = "Unity is photographing the pieces…";
  const id = town;
  try {
    const j = await api("/api/pictures?id=" + encodeURIComponent(id), {}); rep.textContent = j.report; rep.className = /FAIL/.test(j.report) ? "bad" : "";
    const got = await api("/api/pictures?id=" + encodeURIComponent(id));
    if (town === id) { pictures = got; for (const u in images) if (u.startsWith("/pictures/")) delete images[u]; draw(); view3d.changed(); }
  } catch (err) { rep.textContent = "No pictures: " + err.message; rep.className = "bad"; }
  btn.disabled = false; btn.textContent = "Take pictures";
}
$("pictures").onclick = takePictures; $("view3d").onclick = view3d.toggle;
$("undo").onclick = undo; $("redo").onclick = redo; $("save").onclick = save; $("rebuild").onclick = rebuild;
for (const b of document.querySelectorAll("#tools [data-tool]")) b.onclick = () => setTool(b.dataset.tool);
for (const id of ["showHeights", "showCurbs", "showLabels", "showPieces", "showLeaves", "showPictures", "showThrough", "showPlants"]) $(id).onchange = draw;
$("town").onchange = () => load($("town").value);
async function listTowns() {
  const towns = await api("/api/towns"), fresh = await api("/api/new-towns");
  $("town").replaceChildren(...towns.map(t => el("option", {value: t, textContent: t})));
  if (town) $("town").value = town;
  $("newTown").replaceChildren(el("option", {value: "", textContent: "New town…"}), ...fresh.map(t => el("option", {value: t.id, textContent: t.name})));
  $("newTown").hidden = !fresh.length;
  return towns;
}
$("newTown").onchange = async () => {
  const id = $("newTown").value; $("newTown").value = ""; if (!id) return;
  if (dirty && !confirm("This town has changes that are not saved. Leave them?")) return;
  try { await api("/api/new-town?id=" + encodeURIComponent(id), {}); dirty = false; await listTowns(); $("town").value = id; await load(id); hint("A blank plan for " + plan.name + ": paving inside its wall. Draw it, then Save."); }
  catch (err) { alert("No new town: " + err.message); }
};
addEventListener("beforeunload", e => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });
addEventListener("resize", resize);
(async () => {
  resize();
  try {
    const towns = await listTowns();
    tileNames = await api("/api/tiles");
    if (towns.length) await load(towns[0]);
  } catch (err) { hint("Could not reach the town editor's server: " + err.message); }
})();
</script>
</body></html>
